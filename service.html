<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="referrer" content="no-referrer" />
    <title>服务中心-桃花源-我的世界服务器(Minecraft)</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<div class="spinner-wrapper">
    <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
    </div>
</div>
<script type="text/javascript" src="constant/header.js"></script>
<header id="header" class="ex-header service-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h1>服务中心</h1>
            </div>
        </div>
    </div>
</header>

<div id="type-selector-cards" class="cards-2" style="display: none; padding-top: 3rem; padding-bottom: 5rem;">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h2>请选择服务类型</h2>
            </div>
        </div>
        <div class="row service-cards-row">
            <div class="col-lg-4 col-md-6 d-flex justify-content-center service-top-col">
                <div class="card" onclick="selectType('bug')" style="cursor: pointer;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-bug" style="color: #7dc22b;"></i> 反馈建议</h3>
                        <p>遇到问题或改进建议。</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 d-flex justify-content-center service-top-col service-top-col-middle">
                <div class="card" onclick="selectType('report')" style="cursor: pointer;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-flag" style="color: #7dc22b;"></i> 举报玩家</h3>
                        <p>维护服务器良好环境。</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 d-flex justify-content-center service-top-col">
                <div class="card" onclick="selectType('appeal')" style="cursor: pointer;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-gavel" style="color: #7dc22b;"></i> 误封申诉</h3>
                        <p>提交误封申诉申请。</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 offset-lg-2 col-md-6 d-flex justify-content-lg-end justify-content-center service-bottom-left">
                <div class="card" onclick="selectType('progress')" style="cursor: pointer;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-tasks" style="color: #7dc22b;"></i> 处理进度</h3>
                        <p>查看当前处理进度。</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 d-flex justify-content-lg-start justify-content-center service-bottom-right">
                <div class="card" onclick="selectType('forgot')" style="cursor: pointer;">
                    <div class="card-body">
                        <h3 class="card-title"><i class="fas fa-key" style="color: #7dc22b;"></i> 忘记密码</h3>
                        <p>找回游戏账号密码。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="iframe-wrapper" style="display: none;">
    <iframe id="iframe" style="width: 100%;height: 1600px;" scrolling="no"></iframe>
</div>

<div id="type-selector" class="ex-basic-1" style="display: none;">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumbs">
                    <a href="index.html">首页</a>
                    <span>&nbsp;&nbsp;>&nbsp;&nbsp;服务中心</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="iframe-breadcrumbs" class="ex-basic-1" style="display: none;">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumbs">
                    <a href="index.html">首页</a>
                    <span id="title"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="constant/footer.js"></script>
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/scripts.js"></script>
<script>
    function selectType(type) {
        window.location.href = 'service.html?type=' + type + '#header';
    }

    document.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      const iframe = document.getElementById('iframe');
      const title = document.getElementById('title');
      let text = "";
      if (type === "report") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnsbovyxLVbW0eoPtBkEHkYb";
        text = "举报玩家";
        iframe.style = "width: 100%;height: 1900px;";
      } else if (type === "bug") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnhsTiH6K7VE9D3tyeWq9kYg";
        text = "反馈建议";
      } else if (type === "appeal") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnXBrQeNCbCThu1j4rZ0QwUb";
        text = "误封申诉";
      } else if (type === "progress") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/dashboard/shrcn7CWJB2Q38L6dIstPMeLv2f";
        text = "处理进度";
      } else if (type === "forgot") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcn7VR7CTeMbv6BzVPTTP6Jeb";
        text = "忘记密码";
      }

      if (type && text) {
        document.getElementById('iframe-wrapper').style.display = 'block';
        document.getElementById('iframe-breadcrumbs').style.display = 'block';
        document.getElementById('type-selector').style.display = 'none';
        document.getElementById('type-selector-cards').style.display = 'none';
        title.innerHTML = '&nbsp;&nbsp;>&nbsp;&nbsp;<a href="service.html#header">服务中心</a>&nbsp;&nbsp;>&nbsp;&nbsp;' + text;
        document.title = text + '-桃花源-我的世界服务器(Minecraft)';
      } else {
        document.getElementById('iframe-wrapper').style.display = 'none';
        document.getElementById('iframe-breadcrumbs').style.display = 'none';
        document.getElementById('type-selector').style.display = 'block';
        document.getElementById('type-selector-cards').style.display = 'block';
        document.title = '服务中心-桃花源-我的世界服务器(Minecraft)';
      }
    });
</script>
<style>
    @media (max-width: 767.98px) {
        .service-header {
            padding-top: 5rem;
            padding-bottom: 2.5rem;
        }
    }
    #type-selector-cards .service-cards-row {
        display: flex;
        flex-wrap: wrap;
    }
    #type-selector-cards .service-cards-row > div[class*="col-"] {
        margin-bottom: 1.5rem;
    }
    @media (min-width: 992px) {
        #type-selector-cards .service-cards-row > div[class*="col-"] {
            margin-bottom: 2.5rem;
        }
        #type-selector-cards .service-top-col {
            padding-left: 0;
            padding-right: 0;
        }
        #type-selector-cards .service-top-col + .service-top-col {
            padding-left: 0.375rem;
        }
        #type-selector-cards .service-bottom-left {
            padding-right: 3rem;
        }
        #type-selector-cards .service-bottom-right {
            padding-left: 3rem;
        }
    }
    #type-selector-cards .card {
        transition: all 0.2s ease;
        border-radius: 0.375rem;
        margin-bottom: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        max-width: 20.875rem;
        width: 100%;
        display: block;
    }
    #type-selector-cards .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }
    #type-selector-cards .card .card-body {
        border-radius: 0.375rem;
        transition: all 0.2s ease;
    }
    #type-selector-cards .card:hover .card-body {
        border-color: #7dc22b;
    }
</style>
<script type="text/javascript" src="constant/collect.js"></script>
</body>
</html>
