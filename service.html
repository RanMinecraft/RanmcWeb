<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="referrer" content="no-referrer" />
    <title>桃花源-我的世界服务器(Minecraft)</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<div class="spinner-wrapper">
    <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
    </div>
</div>
<script type="text/javascript" src="constant/header.js"></script>
<header id="header" style="background-color: #153e52;padding-top: 7.875rem;"></header>
<div>
    <iframe id="iframe" style="width: 100%;height: 1600px;" scrolling="no"></iframe>
</div>
<div class="ex-basic-1">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumbs">
                    <a href="index.html">首页</a>
                    <span id="title"></span>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="constant/footer.js"></script>
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/scripts.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      const iframe = document.getElementById('iframe');
      const title = document.getElementById('title');
      let text = "";
      if (type === "report") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnsbovyxLVbW0eoPtBkEHkYb";
        text = "举报玩家";
      } else if (type === "bug") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnhsTiH6K7VE9D3tyeWq9kYg";
        text = "反馈建议";
      } else if (type === "appeal") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/form/shrcnXBrQeNCbCThu1j4rZ0QwUb";
        text = "误封申诉";
      } else if (type === "progress") {
        iframe.src = "https://ranmc-cc.feishu.cn/share/base/dashboard/shrcn7CWJB2Q38L6dIstPMeLv2f";
        text = "处理进度";
      }
      title.innerHTML = "&nbsp;&nbsp;>&nbsp;&nbsp;" + text;
      document.title = text + '-桃花源-我的世界服务器(Minecraft)';
    });
</script>
<script type="text/javascript" src="constant/collect.js"></script>
</body>
</html>
